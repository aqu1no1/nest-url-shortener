name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade, build e testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/url_shortener_ci
        run: pnpm prisma:generate

      - name: Oxlint
        run: pnpm lint

      - name: Oxfmt
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Testes unitários
        run: pnpm test:unit

  integration:
    name: Integração e E2E (PostgreSQL isolado)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar Prisma Client
        run: pnpm prisma:generate

      - name: Testes de integração e E2E
        run: pnpm test:docker 4
